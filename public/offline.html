<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#16a5e1" />
    <title>Offline — AptFindr</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;background:#f2f6fa;color:#111111;font:16px/1.5 system-ui,sans-serif}.card{width:min(100%,28rem);padding:2rem;border:1px solid #d9d9d9;border-radius:1rem;background:#fff;box-shadow:0 20px 50px rgba(17,17,17,.1);text-align:center}img{width:5rem;height:5rem}h1{margin:.75rem 0 .5rem;font-size:1.75rem}p{margin:0 0 1.25rem;color:#666666}button{border:0;border-radius:.75rem;padding:.75rem 1rem;background:#16a5e1;color:#fff;font:inherit;font-weight:700;cursor:pointer}
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icon.svg" alt="" />
      <h1>You’re offline</h1>
      <p>Previously opened AptFindr screens may still be available. Reconnect to refresh listings or submit changes.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
